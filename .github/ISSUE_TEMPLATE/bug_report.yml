name: Bug report
description: Report a Pysano problem without private data.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, passwords, recordings, transcripts or personal data. Use sanitized focus diagnostics only."
  - type: input
    id: version
    attributes:
      label: Pysano version and build
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac chip
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: route
    attributes:
      label: Model, target app and audio route
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics (optional)
